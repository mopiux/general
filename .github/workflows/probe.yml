name: Probe

# Herramienta de desarrollo: prepara el entorno de Forge (con fuentes descompiladas)
# y ejecuta un script, por ejemplo para consultar firmas de métodos con javap.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'Proyecto donde preparar el entorno'
        type: string
        default: 'alquimia'
      script:
        description: 'Script bash a ejecutar'
        type: string
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: probe-gradle-v2-${{ inputs.mod }}
          restore-keys: probe-gradle-v2-
      - name: Preparar entorno Forge
        run: |
          chmod +x gradlew
          ./gradlew -p mods/${{ inputs.mod }} compileJava eclipseClasspath --no-daemon -q > /tmp/setup.log 2>&1 || tail -40 /tmp/setup.log
      - name: Script
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          echo "=====PROBE-START====="
          bash -c "$SCRIPT" 2>&1
          echo "=====PROBE-END====="
